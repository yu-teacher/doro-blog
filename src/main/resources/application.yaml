server:
  port: 8082

spring:
  application:
    name: doro-blog
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:25432}/${DB_NAME:service_blog}
    username: ${DB_USER:doro_admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        default_batch_fetch_size: 100
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
      # 요청 본문을 컨트롤러가 파일을 꺼낼 때 비로소 읽는다. 그래야 인증 검사(UploadAuthInterceptor)가 먼저 실행되어
      # 로그인하지 않은 요청이 15MB 를 다 올린 뒤에야 거부되는 일이 없다.
      resolve-lazily: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    table: blog_schema_history
    locations: classpath:db/migration

doro:
  iam:
    jwks-uri: http://${IAM_HOST:localhost}:${IAM_PORT:28080}/.well-known/jwks.json
    # 서버 간 내부 API(게이트웨이를 거치지 않는 Docker 내부 주소): Doro 의 영구 탈퇴 사용자 목록 조회
    internal-url: http://${IAM_HOST:localhost}:${IAM_PORT:28080}
    # IAM 내부 API 호출자 인증용 서비스 토큰(IAM 의 DORO_IAM_INTERNAL_TOKENS 에 'blog:<이 토큰>' 으로 등록). 값은 환경변수로만 준다.
    internal-token: ${DORO_IAM_INTERNAL_TOKEN:}
    # 블로그 BFF 가 받은 OAuth 토큰(cid=블로그 클라이언트)만 받아 준다. 다른 클라이언트의 토큰은 거부한다.
    oauth-client-ids: ${BLOG_OAUTH_CLIENT_ID:doro-blog}
    # 다른 곳에서 로그아웃하면 이 블로그의 세션도 바로 끝난다(IAM 에 닿지 못하면 통과 = fail-open)
    revocation-check: ${DORO_IAM_REVOCATION_CHECK:ENFORCE}
  guard:
    grpc-host: ${GUARD_GRPC_HOST:localhost}
    grpc-port: ${GUARD_GRPC_PORT:9090}
    http-url: http://${GUARD_HTTP_HOST:localhost}:${GUARD_HTTP_PORT:28081}
    http-timeout-ms: ${GUARD_HTTP_TIMEOUT_MS:5000}
    service-token: ${DORO_GUARD_SERVICE_TOKEN:}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:doro_admin}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET:doro-blog-media}
      public-url: ${MINIO_PUBLIC_URL:/media}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # 의존 서비스 상세(DB/Redis 등)는 인증 없이 노출하지 않는다. 상태(UP/DOWN)만 공개된다.
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.doro.blog: ${LOG_LEVEL_APP:INFO}
    com.hunnit_beasts.doro.sdk: ${LOG_LEVEL_SDK:INFO}

# 블로그 BFF 로그인 (Doro OAuth). 로그인 화면은 Doro 가 담당하고, 블로그는 비밀번호를 다루지 않는다.
blog:
  api-key:
    # API 키 사용 기록(요청마다 한 행)을 이 기간만 보관한다. 지난 기록은 주기적으로 지운다.
    log-retention-days: ${BLOG_API_KEY_LOG_RETENTION_DAYS:90}
    # 키 소유자의 도로 계정 상태 확인: 정지·탈퇴 유예 중에는 키를 쓸 수 없다(IAM 내부 API, 서비스 토큰 필요).
    # 정상은 cache-ttl, 그 밖의 상태는 inactive-cache-ttl 동안만 캐시한다(정지 해제가 빨리 반영된다).
    # IAM 에 닿지 못하면 stale-ttl 안의 이전 판정을 쓰고, 없으면 거부(503)한다.
    account-status:
      enabled: ${BLOG_API_KEY_ACCOUNT_STATUS_ENABLED:true}
      cache-ttl: ${BLOG_API_KEY_ACCOUNT_STATUS_CACHE_TTL:PT60S}
      inactive-cache-ttl: ${BLOG_API_KEY_ACCOUNT_STATUS_INACTIVE_CACHE_TTL:PT10S}
      stale-ttl: ${BLOG_API_KEY_ACCOUNT_STATUS_STALE_TTL:PT10M}
  auth:
    # embedded(기본): 로그인·세션·토큰 갱신을 이 서비스가 한다. gateway: 별도 서비스(doro-bff)가 하고 게이트웨이가 Bearer 를 붙여 준다.
    # gateway 로 바꾸면 아래 OAuth·세션 설정은 쓰이지 않는다(BFF 쪽 설정이다).
    mode: ${BLOG_AUTH_MODE:embedded}
    client-id: ${BLOG_OAUTH_CLIENT_ID:doro-blog}
    authorize-url: ${BLOG_OAUTH_AUTHORIZE_URL:http://localhost:28080/oauth2/authorize}
    token-url: ${BLOG_OAUTH_TOKEN_URL:http://${IAM_HOST:localhost}:${IAM_PORT:28080}/oauth2/token}
    revoke-url: ${BLOG_OAUTH_REVOKE_URL:http://${IAM_HOST:localhost}:${IAM_PORT:28080}/oauth2/revoke}
    redirect-uri: ${BLOG_OAUTH_REDIRECT_URI:http://localhost:5173/api/v1/bff/callback}
    cookie-secure: ${BLOG_COOKIE_SECURE:true}
    # 웹이 마운트된 공개 하위 경로(예: /blog). 루트면 비운다. 로그인 시도 쿠키 Path 와 로그인 실패/기본 복귀 위치가 따른다.
    # 바꿀 때는 redirect-uri(BLOG_OAUTH_REDIRECT_URI)와 IAM 에 등록한 복귀 주소도 같은 경로로 맞춘다.
    web-base-path: ${BLOG_WEB_BASE_PATH:}
    # DB 에 저장하는 토큰을 암호화하는 키(base64 32바이트). 기본값 없음: openssl rand -base64 32
    session-encryption-key: ${BLOG_SESSION_KEY:}

  # Doro 에서 영구 탈퇴한 사용자의 블로그 프로필 개인정보를 주기적으로 익명화한다 (Doro 내부 API 를 조회).
  deleted-sync:
    enabled: ${BLOG_DELETED_SYNC_ENABLED:true}
    interval: ${BLOG_DELETED_SYNC_INTERVAL:PT1H}

  # 플랫폼 알림 서비스(doro-notify)로 푸시를 요청한다. service-token 이 비어 있으면(기본) 아무것도 하지 않는다: 아웃박스에 쌓지 않고,
  # 알림 서비스를 부르지 않고, 푸시 설정 API 는 '사용할 수 없음'으로 답한다. 토큰이 있으면 켜진다(되돌리기 = 토큰 비우기).
  notify:
    base-url: ${BLOG_NOTIFY_URL:http://notify-api:8089}
    # 알림 서비스의 NOTIFY_INTERNAL_TOKENS 에 'blog:<이 토큰>' 으로 등록한 값. 값은 환경변수로만 준다.
    service-token: ${BLOG_NOTIFY_TOKEN:}
    # 웹이 마운트된 공개 하위 경로. 알림 주소는 이 경로로 시작하는 절대 경로여야 한다(알림 서비스의 앱 범위).
    base-path: ${BLOG_WEB_BASE_PATH:/blog}
    outbox-interval: ${BLOG_NOTIFY_OUTBOX_INTERVAL:PT5S}
