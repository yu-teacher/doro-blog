server:
  port: 8082

spring:
  application:
    name: doro-blog
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:25432}/${DB_NAME:service_blog}
    username: ${DB_USER:doro_admin}
    password: ${DB_PASSWORD:doro_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    baseline-on-migrate: true
    table: blog_schema_history
    locations: classpath:db/migration

doro:
  iam:
    jwks-uri: http://${IAM_HOST:localhost}:${IAM_PORT:28080}/.well-known/jwks.json
  guard:
    grpc-host: ${GUARD_GRPC_HOST:localhost}
    grpc-port: ${GUARD_GRPC_PORT:9090}
    http-url: http://${GUARD_HTTP_HOST:localhost}:${GUARD_HTTP_PORT:28081}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.doro.blog: DEBUG
    com.hunnit_beasts.doro.sdk: DEBUG
