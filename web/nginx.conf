server {
    listen 80;
    server_name localhost;
    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    # 텍스트 계열 응답 압축
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript text/javascript application/json application/xml image/svg+xml;

    # 보안 헤더 (CSP 는 게이트웨이가 부여한다).
    # nginx 는 location 에 add_header 가 하나라도 있으면 server 수준 헤더를 상속하지 않으므로
    # add_header 를 쓰는 location 에서는 같은 헤더를 다시 선언한다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 파일명에 해시가 들어간 정적 자산은 영구 캐시 (없는 해시 파일은 index.html 로 폴백하지 않고 404)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # SPA 진입점은 항상 재검증하여 새 배포의 해시 자산을 바로 가리키게 한다
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Blog Backend API 프록시
    location /api/ {
        proxy_pass http://doro-blog-backend:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # IAM API 프록시 (인증, 토큰 리프레시)
    location /iam/ {
        proxy_pass http://auth-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO 미디어 서빙 프록시. 버킷 자체(목록 조회)는 공개하지 않는다.
    location = /media/ {
        return 404;
    }

    location /media/ {
        if ($args ~* "(^|&)(list-type|prefix|delimiter|marker|max-keys|versions|uploads)(=|&|$)") {
            return 404;
        }

        proxy_pass http://doro-minio:9000/doro-blog-media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
