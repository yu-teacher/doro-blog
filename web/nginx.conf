server {
    listen 80;
    server_name localhost;
    client_max_body_size 20M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Blog Backend API 프록시
    location /api/ {
        proxy_pass http://doro-blog-backend:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # IAM API 프록시 (인증, 토큰 리프레시)
    location /iam/ {
        proxy_pass http://auth-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO 미디어 서빙 프록시. 버킷 자체(목록 조회)는 공개하지 않는다.
    location = /media/ {
        return 404;
    }

    location /media/ {
        if ($args ~* "(^|&)(list-type|prefix|delimiter|marker|max-keys|versions|uploads)(=|&|$)") {
            return 404;
        }

        proxy_pass http://doro-minio:9000/doro-blog-media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
